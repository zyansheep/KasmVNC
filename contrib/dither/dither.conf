# What contrib/dither/ci.sh tracks and builds for this fork (sourced by bash).

# Upstream, and the fork that carries the patches.
UPSTREAM=kasmtech/KasmVNC
FORK=zyansheep/KasmVNC
# The branch with the carried commits on top of an upstream release tag.
BRANCH=dither
# Upstream's stable release tags: vX.Y.Z (KasmVNC tags no betas or release candidates; GitHub releases marked as
# pre-releases would still match, so check there if one ever appears).
STABLE_TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
# The package: its attribute in default.nix, the name of each release's self-contained nix file, and the smoke test
# binary (<NAME>-smoke).
NAME=kasmvnc
